  <meta charset="UTF-8">

  <title>Mixcloud — POND</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f4f1ec;
      --text: #1c1c1a;
      --text-dim: rgba(28,28,26,0.35);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Times New Roman", Times, serif;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 8vh 6vw;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 32px;
      margin-bottom: 10vh;
    }

    .back {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      color: var(--text-dim);
      text-decoration: none;
      text-transform: uppercase;
    }

    .back:hover { color: var(--text); }

    header h1 {
      font-size: clamp(1rem, 2vw, 1.3rem);
      font-weight: normal;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .link-wrap {
      display: flex;
      align-items: center;
    }

    .mixcloud-link {
      font-size: clamp(0.8rem, 1.2vw, 0.95rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--text);
      padding-bottom: 2px;
      transition: color 0.3s, border-color 0.3s;
    }

    .mixcloud-link:hover {
      color: var(--text-dim);
      border-color: var(--text-dim);
    }

    footer {
      margin-top: 12vh;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="back" href="index.html">← Pond</a>
      <h1>Mixcloud</h1>
    </header>
    <main class="link-wrap">
      <a class="mixcloud-link" href="https://www.mixcloud.com/DJAKIO/" target="_blank" rel="noopener">mixcloud.com/DJAKIO →</a>
    </main>
    <footer>© POND</footer>
  </div>
</body>
